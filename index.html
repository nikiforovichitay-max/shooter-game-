<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Anime Power Shooter</title>
<style>
body { margin:0; background:#0b0b0b; color:white; text-align:center; font-family:Arial; }
canvas { background:radial-gradient(#111,#000); display:block; margin:auto; }
</style>
</head>
<body>

<h2>⚡ Anime Power Shooter ⚡</h2>
<p>Move: ← → | Power: Space</p>
<canvas id="game" width="700" height="450"></canvas>

<script>
const c = document.getElementById("game");
const ctx = c.getContext("2d");

let player = {x:330,y:380,w:40,h:40};
let bullets=[], enemies=[], particles=[];
let keys={}, score=0, lives=3, speed=2;
let gameOver=false;

document.onkeydown = e => keys[e.key]=true;
document.onkeyup = e => keys[e.key]=false;

function spawnEnemy(){
  enemies.push({x:Math.random()*660,y:-40,w:40,h:40});
}

function shoot(){
  bullets.push({x:player.x+18,y:player.y,r:6});
}

function update(){
  if(gameOver) return;

  if(keys["ArrowLeft"] && player.x>0) player.x-=6;
  if(keys["ArrowRight"] && player.x<660) player.x+=6;

  if(keys[" "] && bullets.length<6){
    shoot();
  }

  bullets.forEach(b=>b.y-=8);
  enemies.forEach(e=>e.y+=speed);

  bullets = bullets.filter(b=>b.y>-10);

  enemies.forEach((e,ei)=>{
    if(e.y>450){
      enemies.splice(ei,1);
      lives--;
      if(lives<=0) gameOver=true;
    }
  });

  bullets.forEach((b,bi)=>{
    enemies.forEach((e,ei)=>{
      if(b.x>e.x && b.x<e.x+e.w && b.y>e.y && b.y<e.y+e.h){
        bullets.splice(bi,1);
        enemies.splice(ei,1);
        score++;
        for(let i=0;i<10;i++)
          particles.push({x:e.x+20,y:e.y+20,dx:Math.random()*4-2,dy:Math.random()*4-2});
        if(score%5===0) speed+=0.5;
      }
    });
  });

  particles.forEach(p=>{
    p.x+=p.dx; p.y+=p.dy;
  });
  particles = particles.slice(0,100);
}

function draw(){
  ctx.clearRect(0,0,c.width,c.height);

  // player
  ctx.fillStyle="cyan";
  ctx.fillRect(player.x,player.y,player.w,player.h);

  // bullets
  ctx.fillStyle="orange";
  bullets.forEach(b=>{
    ctx.beginPath();
    ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
    ctx.fill();
  });

  // enemies
  ctx.fillStyle="red";
  enemies.forEach(e=>ctx.fillRect(e.x,e.y,e.w,e.h));

  // particles
  ctx.fillStyle="yellow";
  particles.forEach(p=>ctx.fillRect(p.x,p.y,2,2));

  ctx.fillStyle="white";
  ctx.fillText("Score: "+score,10,20);
  ctx.fillText("Lives: "+lives,10,40);

  if(gameOver){
    ctx.fillStyle="white";
    ctx.font="30px Arial";
    ctx.fillText("GAME OVER",250,220);
    ctx.font="16px Arial";
    ctx.fillText("Refresh to restart",260,250);
  }
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

setInterval(spawnEnemy,1000);
loop();
</script>

</body>
</html>
